name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # The app needs the macOS 26 SDK, which ships with Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          # Newest stable Xcode 26 or later installed on the runner.
          best=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed -E 's#^/Applications/Xcode_(.*)\.app$#\1#' \
            | grep -E '^[0-9]+(\.[0-9]+)*$' \
            | awk -F. '$1 >= 26' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n 1)
          if [ -z "$best" ]; then
            echo "::error::No Xcode 26 or later on this runner; the app needs the macOS 26 SDK."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select --switch "/Applications/Xcode_$best.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build and test
        run: |
          xcodebuild \
            -scheme Editor \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGN_IDENTITY=- \
            build test
