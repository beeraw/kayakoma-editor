name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 1.2.0 (uploaded as a workflow artifact, no release is created)
        required: true
        type: string

permissions:
  contents: write

env:
  SCHEME: Editor
  APP_NAME: Kayakoma Editor
  ASSET_PREFIX: Kayakoma-Editor

jobs:
  release:
    name: Build and publish
    # The app needs the macOS 26 SDK, which ships with Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version '$version' (expected X.Y.Z)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version, build $GITHUB_RUN_NUMBER"

      - name: Select Xcode
        run: |
          # Newest stable Xcode 26 or later installed on the runner.
          best=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed -E 's#^/Applications/Xcode_(.*)\.app$#\1#' \
            | grep -E '^[0-9]+(\.[0-9]+)*$' \
            | awk -F. '$1 >= 26' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n 1)
          if [ -z "$best" ]; then
            echo "::error::No Xcode 26 or later on this runner; the app needs the macOS 26 SDK."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select --switch "/Applications/Xcode_$best.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY=- \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Check the signature and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Signature|Format)'
          built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          if [ "$built" != "$VERSION" ]; then
            echo "::error::The app reports version $built instead of $VERSION."
            exit 1
          fi
          mkdir -p dist
          zip="$ASSET_PREFIX-$VERSION.zip"
          ditto -c -k --keepParent "$app" "dist/$zip"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256")
          cat "dist/$zip.sha256"

      - name: Extract the release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The section "## <version>" of CHANGELOG.md, up to the next section.
          awk -v version="$VERSION" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/whats-new.md"
          if [ ! -s "$RUNNER_TEMP/whats-new.md" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::CHANGELOG.md has no section for $VERSION: the update window would show no notes."
              exit 1
            fi
            echo "::warning::CHANGELOG.md has no section for $VERSION."
          fi
          cat "$RUNNER_TEMP/whats-new.md"

      - name: Sign the update and write the appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          zip="$ASSET_PREFIX-$VERSION.zip"
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::The SPARKLE_ED_PRIVATE_KEY secret is missing: the apps would refuse an unsigned update."
              exit 1
            fi
            echo "::warning::No SPARKLE_ED_PRIVATE_KEY secret: no appcast for this trial build."
            exit 0
          fi
          sign_update="$RUNNER_TEMP/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - -p "dist/$zip")
          length=$(stat -f %z "dist/$zip")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$zip"
          python3 - "$APP_NAME" "$VERSION" "$GITHUB_RUN_NUMBER" "$url" "$length" "$signature" "$RUNNER_TEMP/whats-new.md" > dist/appcast.xml <<'EOF'
          import sys
          from email.utils import formatdate
          from xml.sax.saxutils import escape
          name, version, build, url, length, signature, notes_path = sys.argv[1:]
          notes = open(notes_path, encoding="utf-8").read().strip().replace("]]>", "]]]]><![CDATA[>")
          print(f"""<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>{escape(name)}</title>
              <item>
                <title>{escape(name)} {escape(version)}</title>
                <pubDate>{formatdate(usegmt=True)}</pubDate>
                <sparkle:version>{escape(build)}</sparkle:version>
                <sparkle:shortVersionString>{escape(version)}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <description sparkle:format="plain-text"><![CDATA[{notes}]]></description>
                <enclosure url="{escape(url)}" length="{escape(length)}" type="application/octet-stream" sparkle:edSignature="{escape(signature)}"/>
              </item>
            </channel>
          </rss>""")
          EOF
          cat dist/appcast.xml

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_PREFIX }}-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="$ASSET_PREFIX-$VERSION.zip"
          sha=$(cut -d ' ' -f 1 "dist/$zip.sha256")
          {
            if [ -s "$RUNNER_TEMP/whats-new.md" ]; then
              printf "## What's new\n\n"
              cat "$RUNNER_TEMP/whats-new.md"
              printf "\n"
            fi
            sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$sha/g" -e "s/{{ASSET}}/$zip/g" .github/release-notes.md
          } > "$RUNNER_TEMP/release-notes.md"
          # The apps read the appcast of the latest release; a prerelease never carries one.
          prerelease=""
          assets=("dist/$zip" "dist/$zip.sha256" "dist/appcast.xml")
          case "$VERSION" in *-*) prerelease="--prerelease"; assets=("dist/$zip" "dist/$zip.sha256") ;; esac
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$APP_NAME $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            $prerelease
