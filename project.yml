name: KayakomaEditor
options:
  bundleIdPrefix: app.kayakoma
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: fr
  createIntermediateGroups: true

# The engine comes from GitHub. For local engine development, see
# "Developing with a local KayakomaKit" in the README.
packages:
  KayakomaKit:
    url: https://github.com/beeraw/kayakoma-kit.git
    from: 1.0.1

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Editor:
    type: application
    platform: macOS
    sources: [Editor]
    dependencies:
      - package: KayakomaKit
    # Writes Translations/*.xliff into the string catalog before it is
    # compiled. The script sandbox only lets it read the files it declares:
    # the XLIFF files come from Translations/Translations.xcfilelist, which
    # the script keeps up to date. It runs only when one of them changed, and
    # only rewrites the catalog when a translation changed.
    preBuildScripts:
      - name: Import Translations
        script: |
          /usr/bin/python3 -B "$SRCROOT/scripts/translations.py" import --catalog "$SRCROOT/Editor/Localizable.xcstrings" --translations "$SRCROOT/Translations"
        inputFiles:
          - $(SRCROOT)/scripts/translations.py
        inputFileLists:
          - $(SRCROOT)/Translations/Translations.xcfilelist
        outputFiles:
          - $(SRCROOT)/Editor/Localizable.xcstrings
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        PRODUCT_NAME: Kayakoma Editor
        PRODUCT_BUNDLE_IDENTIFIER: app.kayakoma.editor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    entitlements:
      path: Editor/Editor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Folder windows keep their folder across launches.
        com.apple.security.files.bookmarks.app-scope: true
        # Images next to the edited file are read by path; the sandbox only
        # grants the file itself, so reading is allowed everywhere.
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
    info:
      path: Editor/Info.plist
      properties:
        CFBundleDisplayName: Kayakoma Editor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]

  # Unhosted: the tests compile the app's sources and never launch the app.
  EditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Editor
        excludes:
          - EditorApp.swift
          - Info.plist
          - Editor.entitlements
          - AppIcon.icon
          - Assets.xcassets
          - Localizable.xcstrings
          - Credits.rtf
      - EditorTests
    dependencies:
      - package: KayakomaKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kayakoma.editor.tests

schemes:
  Editor:
    build:
      targets:
        Editor: all
      # Same import as the build phase, run outside the script sandbox before
      # Xcode plans the build: a newly added XLIFF file joins the file list
      # and its language ships from the first build.
      preActions:
        - name: Import Translations
          settingsTarget: Editor
          script: |
            /usr/bin/python3 -B "$SRCROOT/scripts/translations.py" import --catalog "$SRCROOT/Editor/Localizable.xcstrings" --translations "$SRCROOT/Translations"
    test:
      targets: [EditorTests]
